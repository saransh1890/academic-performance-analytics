name: Application checks
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Rules, security, integration and UI tests
        run: python scripts/run_part3_checks.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part3-test-reports
          path: docs/reports/
